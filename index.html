<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFSUN6T9</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;overflow-x:hidden}
#bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:-1}
.hero{height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:70px}
.scroll-down{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0.8;animation:bounce 2s infinite;cursor:pointer}
.scroll-down span{font-size:11px;letter-spacing:3px;text-transform:uppercase}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.content{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
.container{width:90%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:16px;width:100%}
.row a{flex:1}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:19px;border-radius:22px;text-decoration:none;color:#fff;font-weight:700;font-size:15px;
  background:rgba(255,255,255,0.09);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:0 10px 35px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  transition:.3s;
}
.btn i{font-size:20px}
.btn:hover{background:rgba(255,255,255,0.15);transform:translateY(-4px)}
.full{width:100%}
#soundBtn{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:50px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.12);backdrop-filter:blur(15px);color:#fff;cursor:pointer;z-index:10;font-size:13px}
</style>
</head>
<body>

<video autoplay loop playsinline id="bg-video" preload="auto">
  <source src="bg.mp4#t=0" type="video/mp4">
</video>
<div class="overlay"></div>

<section class="hero">
  <div class="scroll-down" onclick="document.getElementById('links').scrollIntoView()">
    <span>Scroll Down</span>
    <i class="fas fa-chevron-down"></i>
  </div>
</section>

<section class="content" id="links">
  <div class="container">
    <div class="row">
      <a class="btn" href="https://wa.me/8801317021116" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      <a class="btn" href="https://discord.gg/z8Xye89Z8s" target="_blank"><i class="fab fa-discord"></i> Discord</a>
    </div>
    <a class="btn full" href="https://t.me/RAFSUN6T9" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
  </div>
</section>

<button id="soundBtn">🔊 Sound On</button>

<script>
const video = document.getElementById('bg-video');
const btn = document.getElementById('soundBtn');

// VIDEO ALWAYS START FROM 0
video.currentTime = 0;
video.addEventListener('loadedmetadata', () => {
  video.currentTime = 0;
});
video.addEventListener('ended', () => {
  video.currentTime = 0;
  video.play();
});

// TRY TO AUTOPLAY WITH SOUND
video.muted = false;
video.volume = 1;
let p = video.play();
if(p !== undefined){
  p.then(()=>{ btn.textContent="🔊 Sound On"; }).catch(()=>{
    video.muted = true;
    video.currentTime = 0;
    video.play();
    btn.textContent="🔇 Tap to Enable Sound";
  });
}

function enableSound(){
  video.muted = false;
  video.volume = 1;
  video.currentTime = 0;
  video.play();
  btn.textContent="🔊 Sound On";
  document.removeEventListener('click', enableSound);
  document.removeEventListener('touchstart', enableSound);
}
document.addEventListener('click', enableSound);
document.addEventListener('touchstart', enableSound);
document.addEventListener('scroll', enableSound, {once:true});

btn.onclick = (e) => {
  e.stopPropagation();
  if(video.muted){ video.muted=false; btn.textContent="🔊 Sound On"; }
  else{ video.muted=true; btn.textContent="🔇 Sound Off"; }
};
</script>

</body>
</html>
